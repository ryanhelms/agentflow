# Commit rules for the devflow repository itself. This repo follows the same commit
# convention devflow enforces in the repos that use it; it is not a devflow-managed repo
# otherwise (no flow map transitions, no semver-release; see AGENTS.md).
devflow: 1

commit:
  types: [feat, fix, perf, refactor, docs, test, build, ci, chore, revert]
  subject_max: 72
  ai_trailer: false
  # Jira keys are optional here until devflow work has its own Jira project. Remove this
  # line to require type(KEY-123): ... like every devflow-managed repo.
  require_key: false

task_management:
  provider: github-issues
  settings:
    repository: nscaledev/devflow
    transitions:
      pr.merged: closed
      "#done": none
  templates:
    catalog: .devflow/task-templates.json
    default:
      name: engineering-task
      revision: "1"

knowledge_base:
  provider: repository
  settings:
    directory: docs/knowledge
    publication: pull-request
