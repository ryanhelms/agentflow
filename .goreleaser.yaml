# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: agentflow

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: agentflow
    main: ./cmd/agentflow
    binary: agentflow
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/nscaledev/agentflow/internal/version.Version={{ .Version }}
      - -X github.com/nscaledev/agentflow/internal/version.Commit={{ .FullCommit }}
      - -X github.com/nscaledev/agentflow/internal/version.Date={{ .Date }}

archives:
  - id: agentflow
    ids: [agentflow]
    name_template: "agentflow_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

# The GitHub Release is the changelog: commits since the previous tag, grouped by
# Conventional Commit type. docs/test/ci/chore commits are left out.
changelog:
  use: github
  sort: asc
  groups:
    - title: Breaking changes
      regexp: '^[a-z]+(\([^)]*\))?!:'
      order: 0
    - title: Features
      regexp: '^feat(\([^)]*\))?:'
      order: 1
    - title: Fixes
      regexp: '^(fix|perf)(\([^)]*\))?:'
      order: 2
    - title: Other changes
      order: 999
  filters:
    exclude:
      - '^(docs|test|ci|chore|style)(\([^)]*\))?:'
      - '^Merge '

release:
  extra_files:
    - glob: install.sh
    - glob: install.ps1
  github:
    owner: ryanhelms
    name: agentflow
  # The release workflow verifies provenance before publishing the draft.
  draft: true
  prerelease: "false"
  make_latest: "false"
  footer: |
    Install or update: `agentflow update`. Verify: `gh attestation verify <archive> --repo ryanhelms/agentflow`.
