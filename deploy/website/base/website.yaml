apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentflow-website
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agentflow-website
  template:
    metadata:
      labels:
        app: agentflow-website
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: website
          image: agentflow-website
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: temp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
      volumes:
        - name: temp
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: agentflow-website
spec:
  type: ClusterIP
  selector:
    app: agentflow-website
  ports:
    - name: http
      port: 8080
      targetPort: http
