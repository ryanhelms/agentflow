name: devflow ship
description: >
  Apply Jira transitions and optional fix versions, or preview other configured task providers.
inputs:
  event:
    description: deploy.staging or deploy.production
    required: true
  range:
    description: Git range of shipped commits (e.g. v1.4.0..HEAD). Overrides since-tag.
    required: false
    default: ""
  since-tag:
    description: Previous release tag; the range becomes <since-tag>..HEAD
    required: false
    default: ""
  fix-version:
    description: Jira version name to add to each ticket (created in the project if missing)
    required: false
    default: ""
  dry-run:
    description: Report what would change without writing to Jira
    required: false
    default: "false"
outputs:
  keys:
    description: Space-separated shipped task keys (Jira keys for legacy repositories)
    value: ${{ steps.keys.outputs.keys }}
runs:
  using: composite
  steps:
    - uses: $/actions/setup
      with:
        binary: true
    - name: Collect shipped keys
      id: keys
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        RANGE: ${{ inputs.range }}
        SINCE: ${{ inputs.since-tag }}
      run: |
        set -euo pipefail
        if [ -z "$RANGE" ]; then
          if [ -n "$SINCE" ]; then RANGE="$SINCE..HEAD"
          else
            prev=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
            RANGE="${prev:+$prev..}HEAD"
          fi
        fi
        provider=$(devflow keys --provider)
        if [ "$provider" = jira ]; then
          bin=$(cd "$ACTION_PATH/../../bin" && pwd)
          keys=$("$bin/jira-keys.sh" "$RANGE" | paste -sd' ' -)
        else
          keys=$(devflow keys --shipped --range "$RANGE" | paste -sd' ' -)
        fi
        echo "provider=$provider" >> "$GITHUB_OUTPUT"
        echo "Shipped keys in $RANGE: ${keys:-none}"
        echo "keys=$keys" >> "$GITHUB_OUTPUT"

    - name: Apply Jira effects for shipped commits
      if: steps.keys.outputs.keys != '' && steps.keys.outputs.provider == 'jira'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        KEYS: ${{ steps.keys.outputs.keys }}
        EVENT: ${{ inputs.event }}
        FIX_VERSION: ${{ inputs.fix-version }}
        DRY: ${{ inputs.dry-run }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail
        root=$(cd "$ACTION_PATH/../.." && pwd)
        export FLOW_MAP="${FLOW_MAP:-$root/flow-map.yml}"
        [ "$DRY" = "true" ] && export DRY_RUN=1
        export TRANSITION_COMMENT="Shipped ($EVENT) by $GITHUB_REPOSITORY: $RUN_URL"
        for key in $KEYS; do
          "$root/bin/transition.sh" "$key" "$EVENT" || echo "::warning::$key: transition failed"
          if [ -n "$FIX_VERSION" ] && [ "$DRY" != "true" ]; then
            "$root/bin/jira-fix-version.sh" "$key" "$FIX_VERSION" || echo "::warning::$key: fix version failed"
          fi
        done
    - name: Preview shipped task effects
      if: steps.keys.outputs.keys != '' && steps.keys.outputs.provider != 'jira'
      shell: bash
      env:
        KEYS: ${{ steps.keys.outputs.keys }}
        EVENT: ${{ inputs.event }}
        DRY: ${{ inputs.dry-run }}
        PROVIDER: ${{ steps.keys.outputs.provider }}
        GH_TOKEN: ${{ (steps.keys.outputs.provider == 'github-issues' || steps.keys.outputs.provider == 'repository') && github.token || '' }}
      run: |
        set -euo pipefail
        if [ "$DRY" != true ]; then
          echo "::notice::Ship previews task changes. Apply a reviewed transition through devflow transition."
        fi
        if [ "$PROVIDER" = repository ]; then gh auth setup-git --hostname github.com; fi
        read -r -a tasks <<<"$KEYS"
        for key in "${tasks[@]}"; do
          devflow transition --shipped --dry-run "$key" "$EVENT"
        done
