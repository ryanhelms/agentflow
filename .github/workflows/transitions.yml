# Plan branch, PR and push events using the configured task provider.
name: transitions

on:
  workflow_call:
    inputs:
      dry-run:
        description: Preview changes on the Jira route
        type: boolean
        default: false
    secrets:
      JIRA_USER:
        required: false
      JIRA_TOKEN:
        required: false
      ASANA_ACCESS_TOKEN:
        required: false
      TASK_READ_TOKEN:
        description: Optional repository-scoped token with Issues read access
        required: false

permissions:
  contents: read

jobs:
  transition:
    if: vars.AGENTFLOW_ENABLED != 'false'
    runs-on: ubuntu-latest
    concurrency:
      group: agentflow-transitions-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: $/actions/setup
        with:
          binary: true
      - name: Fetch the reviewed caller source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          directory=$(reviewed-worktree.sh)
          printf 'directory=%s\n' "$directory" >> "$GITHUB_OUTPUT"
      - id: task
        name: Resolve task provider
        working-directory: ${{ steps.source.outputs.directory }}
        run: |
          provider=$(agentflow keys --provider)
          echo "provider=$provider" >> "$GITHUB_OUTPUT"
      - name: Apply legacy Jira transitions
        if: steps.task.outputs.provider == 'jira'
        env:
          JIRA_BASE: ${{ vars.JIRA_BASE }}
          JIRA_USER: ${{ secrets.JIRA_USER }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          DRY_RUN: ${{ inputs.dry-run && '1' || '0' }}
        working-directory: ${{ steps.source.outputs.directory }}
        run: |
          if [ -z "$JIRA_BASE" ] || [ -z "$JIRA_TOKEN" ]; then
            echo "::warning::JIRA_BASE or JIRA_TOKEN not set; agentflow transitions skipped"
            exit 0
          fi
          handle-event.sh
      - name: Preview linked task transitions
        if: steps.task.outputs.provider != 'jira' && steps.task.outputs.provider != 'none'
        env:
          AGENTFLOW_HOME: ${{ runner.temp }}/agentflow-transitions
          AGENTFLOW_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PROVIDER: ${{ steps.task.outputs.provider }}
          ASANA_ACCESS_TOKEN: ${{ steps.task.outputs.provider == 'asana' && secrets.ASANA_ACCESS_TOKEN || '' }}
          GH_TOKEN: ${{ steps.task.outputs.provider == 'github-issues' && (secrets.TASK_READ_TOKEN || github.token) || (steps.task.outputs.provider == 'repository') && github.token || '' }}
          DRY_RUN: ${{ inputs.dry-run }}
        working-directory: ${{ steps.source.outputs.directory }}
        run: |
          if [ "$PROVIDER" = repository ]; then gh auth setup-git --hostname github.com; fi
          if [ "$DRY_RUN" != true ]; then
            echo "::notice::Generic task workflows preview changes. Apply the reviewed transition through agentflow transition."
          fi
          agentflow transition --github-event --dry-run
