name: ci

on:
  pull_request:
    # edited: re-check when the PR title changes (it becomes the squash commit).
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: latest

  windows-commit-approvals:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Verify commit approvals and configured Git hooks
        run: >-
          go test -count=1 -v ./internal/gitx
          -run 'Test(StagedSnapshotUsesIndexAndGuardsHooks|CommitMessageHookCannotReplaceApprovedMessage|ExactCommit.*Hooks|GuardHookDiscovery)'

  convention:
    # devflow's own repo follows the commit convention it ships. Keys are optional here
    # (commit.require_key: false in .devflow/config.yml) until devflow has a Jira project.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      TITLE: ${{ github.event.pull_request.title }}
      NUMBER: ${{ github.event.pull_request.number }}
      BASE: ${{ github.event.pull_request.base.sha }}
      HEAD: ${{ github.event.pull_request.head.sha }}
      DEVFLOW_NO_UPDATE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go build -o "$RUNNER_TEMP/devflow" ./cmd/devflow
      - name: PR title (becomes the squash commit and decides the version bump)
        run: |
          # Check the exact subject the squash merge will create: "<title> (#<number>)".
          printf '%s (#%s)\n' "$TITLE" "$NUMBER" > "$RUNNER_TEMP/title.txt"
          "$RUNNER_TEMP/devflow" lint-msg "$RUNNER_TEMP/title.txt"
      - name: Every commit in the PR
        run: |
          status=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg.txt"
            if ! "$RUNNER_TEMP/devflow" lint-msg "$RUNNER_TEMP/msg.txt"; then
              echo "::error::commit ${sha:0:7} does not follow the convention"
              status=1
            fi
          done
          exit "$status"
      - name: README.md kept current (warning only)
        run: |
          # 1. Code, templates, adapters, workflows, actions, scripts or config that people
          #    using devflow interact with changed, but README.md did not.
          changed=$(git diff --name-only "$BASE...$HEAD")
          reader_visible=$(grep -E '^(cmd/|internal/|templates/|adapters/|actions/|bin/|flow-map\.yml|policy/|\.github/workflows/)' <<<"$changed" \
            | grep -vE '^\.github/workflows/(ci|release)\.yml$|_test\.go$' || true)
          if [ -n "$reader_visible" ] && ! grep -qx README.md <<<"$changed"; then
            echo "::warning title=README.md not updated::This PR changes commands, workflows, templates or config but not README.md. Update the README if a reader would notice, or say in the PR description why not (AGENTS.md: Keep README.md current)."
            printf '%s\n' "$reader_visible" | sed 's/^/  /'
          fi

          # 2. The status area at the top of the README names the latest release. The
          #    release workflow updates it; a mismatch means it was edited or a release failed.
          latest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          # shellcheck disable=SC2016 # backticks are literal in the sed pattern
          shown=$(sed -nE 's#.*<!-- devflow:version -->`?([^`<]*)`?<!-- /devflow:version -->.*#\1#p' README.md | head -n1)
          if [ -z "$shown" ]; then
            echo "::warning title=README status area::README.md has no devflow:version marker in its status table; the release workflow can't keep the current release up to date."
          elif [ -n "$latest" ] && [ "$shown" != "$latest" ]; then
            echo "::warning title=README status area::README.md shows $shown as the current release, but the latest release is $latest."
          fi
          if git diff --name-only "$BASE...$HEAD" | grep -qE '^(docs/rollout\.md|docs/artifact/)' && ! grep -qx README.md <<<"$changed"; then
            echo "::warning title=README status area::Rollout or blueprint changed. Check the README Status row (approval, rollout phase, who uses devflow) is still true."
          fi

      - name: CHANGELOG.md is generated on release, never edited in a PR
        run: |
          # Creating the file once (bootstrap) is allowed; changing it afterwards is not.
          if git cat-file -e "$BASE:CHANGELOG.md" 2>/dev/null &&
             git diff --name-only "$BASE...$HEAD" | grep -qx CHANGELOG.md; then
            echo "::error::CHANGELOG.md is generated by the release workflow from commit messages. Revert your change; write a good PR title instead."
            exit 1
          fi

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: agent docs
        run: scripts/check-agent-docs.sh
      - name: shellcheck
        run: |
          shellcheck -x install.sh bin/*.sh scripts/*.sh .githooks/commit-msg .githooks/pre-push .githooks/claude-pre-bash \
            templates/repo/.devflow/bin/devflow \
            templates/repo/.githooks/commit-msg \
            adapters/claude-code/bin/launch \
            adapters/claude-code/bin/devflow
      - name: Test project installer
        run: bash scripts/test-install-sh.sh
      - uses: $/actions/setup
        with:
          binary: true
      - name: Verify same-commit setup action
        run: |
          test -x "$DEVFLOW_ROOT/bin/reviewed-revision.sh"
          test -r "$FLOW_MAP"
          devflow version
      - name: Test workflow trust boundaries
        run: bash scripts/test-workflow-trust.sh
      - name: actionlint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tool_dir=$(mktemp -d)
          trap 'rm -rf "$tool_dir"' EXIT
          archive=actionlint_1.7.12_linux_amd64.tar.gz
          gh release download v1.7.12 --repo rhysd/actionlint --pattern "$archive" --dir "$tool_dir"
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$tool_dir/$archive" | sha256sum --check
          tar -xzf "$tool_dir/$archive" -C "$tool_dir" actionlint
          scripts/lint-workflows.sh "$tool_dir/actionlint"
      - name: Validate JSON and YAML
        run: |
          find . -name '*.json' -not -path './.git/*' -print0 | xargs -0 -n1 jq empty
          find . \( -name '*.yml' -o -name '*.yaml' \) -not -path './.git/*' -print0 | xargs -0 -n1 yq eval 'true' > /dev/null

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test PowerShell installer
        shell: pwsh
        run: ./scripts/test-install-ps1.ps1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Test packaged MCP launchers on Windows
        run: go test ./internal/setup -run 'Test(CodexPluginCarriesCurrentVerifiedLaunchers|PluginServersKeepTargetDirectoryAndClient)' -count=1

  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          args: check
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          args: release --snapshot --clean
