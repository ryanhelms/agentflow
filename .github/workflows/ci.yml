name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  convention:
    # devflow's own repo follows the commit convention it ships. Keys are optional here
    # (commit.require_key: false in .devflow/config.yml) until devflow has a Jira project.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      TITLE: ${{ github.event.pull_request.title }}
      BASE: ${{ github.event.pull_request.base.sha }}
      HEAD: ${{ github.event.pull_request.head.sha }}
      DEVFLOW_NO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o "$RUNNER_TEMP/devflow" ./cmd/devflow
      - name: PR title (becomes the squash commit and decides the version bump)
        run: |
          printf '%s\n' "$TITLE" > "$RUNNER_TEMP/title.txt"
          "$RUNNER_TEMP/devflow" lint-msg "$RUNNER_TEMP/title.txt"
      - name: Every commit in the PR
        run: |
          status=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg.txt"
            if ! "$RUNNER_TEMP/devflow" lint-msg "$RUNNER_TEMP/msg.txt"; then
              echo "::error::commit ${sha:0:7} does not follow the convention"
              status=1
            fi
          done
          exit "$status"
      - name: README.md kept current (warning only)
        run: |
          changed=$(git diff --name-only "$BASE...$HEAD")
          user_facing=$(grep -E '^(cmd/|internal/|templates/|adapters/|actions/|bin/|flow-map\.yml|policy/|\.github/workflows/)' <<<"$changed" \
            | grep -vE '^\.github/workflows/(ci|release)\.yml$|_test\.go$' || true)
          if [ -n "$user_facing" ] && ! grep -qx README.md <<<"$changed"; then
            echo "::warning title=README.md not updated::This PR changes user-facing files but not README.md. Update the README if a reader would notice the change, or say in the PR description why not (AGENTS.md: Keep README.md current)."
            printf '%s\n' "$user_facing" | sed 's/^/  /'
          fi
      - name: CHANGELOG.md is generated on release, never edited in a PR
        run: |
          # Creating the file once (bootstrap) is allowed; changing it afterwards is not.
          if git cat-file -e "$BASE:CHANGELOG.md" 2>/dev/null &&
             git diff --name-only "$BASE...$HEAD" | grep -qx CHANGELOG.md; then
            echo "::error::CHANGELOG.md is generated by the release workflow from commit messages. Revert your change; write a good PR title instead."
            exit 1
          fi

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: agent docs
        run: scripts/check-agent-docs.sh
      - name: shellcheck
        run: |
          shellcheck -x bin/*.sh scripts/*.sh .githooks/commit-msg \
            templates/repo/.devflow/bin/devflow \
            templates/repo/.githooks/commit-msg \
            adapters/claude-code/bin/launch
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color
      - name: Validate JSON and YAML
        run: |
          find . -name '*.json' -not -path './.git/*' -print0 | xargs -0 -n1 jq empty
          find . \( -name '*.yml' -o -name '*.yaml' \) -not -path './.git/*' -print0 | xargs -0 -n1 yq eval 'true' > /dev/null

  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          args: check
      - uses: goreleaser/goreleaser-action@v6
        with:
          args: release --snapshot --clean
