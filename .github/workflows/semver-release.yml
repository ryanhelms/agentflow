# Fully automatic semantic versioning and GitHub Releases for every deployable unit.
#
# Call it on push to the default branch. release-please reads Conventional Commits
# since each unit's last tag and opens a Release PR; this workflow auto-merges it, which
# tags each changed unit (v1.4.0, or api-v1.4.0 in monorepos) and publishes a GitHub
# Release with the changelog. Then it builds and attaches the unit's artifacts:
#   binary  - GoReleaser archives + checksums.txt, with build attestations
#   image   - container image tagged X.Y.Z, X.Y, X (from 1.0) and sha, with attestation
#   helm    - chart packaged at the release version, pushed to OCI and attached
#   library - Go submodule tag (path/vX.Y.Z), npm or PyPI publish, Terraform tag
# and previews released task references and Jira Fix Versions for review.
#
# Units come from .agentflow/releases.yml (agentflow release init). Works with the
# workflow's own token: the `releases` output feeds the caller's release-notes job, so
# nothing depends on release events. GitHub doesn't run checks on a PR opened with that
# token, so where branch rules require checks the Release PR waits until someone closes
# and reopens it (or clicks "Update branch"); it then merges itself. An optional agentflow
# GitHub App (vars.AGENTFLOW_APP_ID, secrets.AGENTFLOW_APP_PRIVATE_KEY) removes that step.
name: semver-release

on:
  workflow_call:
    inputs:
      registry:
        description: Image and chart registry (default ghcr.io/<owner>)
        type: string
        required: false
        default: ""
    outputs:
      releases:
        description: JSON array of released units {name, path, tag, version, url}
        value: ${{ jobs.release.outputs.matrix }}
    secrets:
      AGENTFLOW_APP_PRIVATE_KEY:
        required: false
      NPM_TOKEN:
        required: false
      JIRA_USER:
        required: false
      JIRA_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: semver-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.rp.outputs.releases_created }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: app
        if: vars.AGENTFLOW_APP_ID != ''
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.AGENTFLOW_APP_ID }}
          private-key: ${{ secrets.AGENTFLOW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.agentflow/releases.yml
            /release-please-config.json
            /.release-please-manifest.json

      - name: Check release configuration
        run: |
          for f in .agentflow/releases.yml release-please-config.json .release-please-manifest.json; do
            [ -f "$f" ] || { echo "::error::$f is missing. Run: agentflow release init"; exit 1; }
          done

      - id: rp
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          token: ${{ steps.app.outputs.token || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Auto-merge the Release PR
        if: steps.rp.outputs.pr
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          PR_JSON: ${{ steps.rp.outputs.pr }}
        run: |
          number=$(jq -r '.number' <<<"$PR_JSON")
          # --auto waits for required checks; without branch protection merge directly.
          gh pr merge "$number" --repo "$GITHUB_REPOSITORY" --auto --squash \
            || gh pr merge "$number" --repo "$GITHUB_REPOSITORY" --squash

      - id: matrix
        name: Released units
        if: steps.rp.outputs.releases_created == 'true'
        env:
          OUTPUTS: ${{ toJSON(steps.rp.outputs) }}
          REGISTRY: ${{ inputs.registry || format('ghcr.io/{0}', github.repository_owner) }}
        run: |
          set -euo pipefail
          paths=$(jq -c '.paths_released | fromjson' <<<"$OUTPUTS")
          registry=$(tr '[:upper:]' '[:lower:]' <<<"$REGISTRY")
          matrix=$(jq -c -n --argjson paths "$paths" --argjson out "$OUTPUTS" \
                     --argjson units "$(yq -o=json '.units' .agentflow/releases.yml)" \
                     --arg registry "$registry" '
            [ $paths[] as $p
              | ($units[] | select(.path == $p)) as $u
              | {
                  name: $u.name, path: $p,
                  tag: ($out[$p + "--tag_name"] // (if $p == "." then $out.tag_name else null end)),
                  version: ($out[$p + "--version"] // (if $p == "." then $out.version else null end)),
                  major: ($out[$p + "--major"] // (if $p == "." then $out.major else null end)),
                  minor: ($out[$p + "--minor"] // (if $p == "." then $out.minor else null end)),
                  url: ($out[$p + "--html_url"] // (if $p == "." then $out.html_url else null end)),
                  builds: (($u.builds // []) | join(",")),
                  image: ($u.image // ($registry + "/" + $u.name)),
                  dockerfile: ($u.dockerfile // "Dockerfile"),
                  chart: ($u.chart // ""), publish: ($u.publish // ""),
                  registry: $registry
                } ]')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          jq -r '.[] | "Released \(.name) \(.tag): \(.url)"' <<<"$matrix"

  build:
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        unit: ${{ fromJSON(needs.release.outputs.matrix) }}
    permissions:
      contents: read
    env:
      TAG: ${{ matrix.unit.tag }}
      VERSION: ${{ matrix.unit.version }}
      UNIT_PATH: ${{ matrix.unit.path }}
    steps:
      - uses: $/actions/setup
      - name: Resolve released source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(reviewed-revision.sh release "$TAG")
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare artifact staging
        run: |
          git -c advice.detachedHead=false switch --detach "$AGENTFLOW_RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$AGENTFLOW_RELEASE_SHA"
          artifacts="$RUNNER_TEMP/agentflow-release-artifacts"
          mkdir -p "$artifacts"/{binaries,charts,libraries}
          printf 'ARTIFACTS=%s\n' "$artifacts" >> "$GITHUB_ENV"
        env:
          AGENTFLOW_RELEASE_SHA: ${{ steps.source.outputs.sha }}

      - if: contains(matrix.unit.builds, 'binary') && hashFiles(format('{0}/go.mod', matrix.unit.path)) != ''
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: ${{ matrix.unit.path }}/go.mod
      - name: Build binaries
        if: contains(matrix.unit.builds, 'binary')
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          workdir: ${{ matrix.unit.path }}
          args: release --clean --skip=publish,validate,announce
        env:
          GORELEASER_CURRENT_TAG: v${{ matrix.unit.version }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Stage binaries
        if: contains(matrix.unit.builds, 'binary')
        run: |
          shopt -s nullglob
          archives=("$UNIT_PATH"/dist/*.tar.gz "$UNIT_PATH"/dist/*.zip)
          [ ${#archives[@]} -gt 0 ] || { echo "::error::GoReleaser produced no archives"; exit 1; }
          cp -- "${archives[@]}" "$UNIT_PATH/dist/checksums.txt" "$ARTIFACTS/binaries/"

      - if: contains(matrix.unit.builds, 'image')
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - id: meta
        if: contains(matrix.unit.builds, 'image')
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ matrix.unit.image }}
          labels: |
            org.opencontainers.image.version=${{ matrix.unit.version }}
      - if: contains(matrix.unit.builds, 'image')
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.unit.path }}
          file: ${{ matrix.unit.path }}/${{ matrix.unit.dockerfile }}
          push: false
          outputs: type=docker,dest=${{ env.ARTIFACTS }}/image.tar
          tags: agentflow-release:build
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ matrix.unit.version }}

      - if: contains(matrix.unit.builds, 'helm')
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      - name: Package chart
        if: contains(matrix.unit.builds, 'helm')
        env:
          CHART: ${{ matrix.unit.chart }}
        run: |
          dir="$UNIT_PATH/${CHART:-.}"
          helm dependency build "$dir" >/dev/null 2>&1 || true
          helm package "$dir" --version "$VERSION" --app-version "$VERSION" --destination "$ARTIFACTS/charts"

      - if: contains(matrix.unit.builds, 'library') && matrix.unit.publish == 'npm'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          registry-url: https://npm.pkg.github.com
      - name: Pack npm package
        if: contains(matrix.unit.builds, 'library') && matrix.unit.publish == 'npm'
        working-directory: ${{ matrix.unit.path }}
        run: |
          npm run prepublishOnly --if-present
          npm pack --pack-destination "$ARTIFACTS/libraries"
      - name: Build Python package
        if: contains(matrix.unit.builds, 'library') && matrix.unit.publish == 'pypi'
        working-directory: ${{ matrix.unit.path }}
        run: pipx run build --outdir "$ARTIFACTS/libraries"

      - name: Record artifact source and hashes
        env:
          AGENTFLOW_RELEASE_SHA: ${{ steps.source.outputs.sha }}
        run: release-artifacts.sh record "$ARTIFACTS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agentflow-release-${{ strategy.job-index }}
          path: ${{ env.ARTIFACTS }}
          if-no-files-found: error
          overwrite: true

  publish:
    needs: [release, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        unit: ${{ fromJSON(needs.release.outputs.matrix) }}
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ matrix.unit.tag }}
      VERSION: ${{ matrix.unit.version }}
      UNIT_PATH: ${{ matrix.unit.path }}
    steps:
      - uses: $/actions/setup
      - name: Prepare artifact staging
        run: printf 'ARTIFACTS=%s/agentflow-release-artifacts\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: agentflow-release-${{ strategy.job-index }}
          path: ${{ env.ARTIFACTS }}
      - name: Verify artifacts against the reviewed release
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(reviewed-revision.sh release "$TAG")
          AGENTFLOW_RELEASE_SHA="$sha" release-artifacts.sh verify "$ARTIFACTS"
          printf 'sha=%s\nshort_sha=%s\n' "$sha" "${sha:0:7}" >> "$GITHUB_OUTPUT"

      - if: contains(matrix.unit.builds, 'binary')
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            ${{ env.ARTIFACTS }}/binaries/*.tar.gz
            ${{ env.ARTIFACTS }}/binaries/*.zip
      - name: Attach binaries to the release
        if: contains(matrix.unit.builds, 'binary')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "$ARTIFACTS"/binaries/* --clobber

      - if: contains(matrix.unit.builds, 'image')
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        if: contains(matrix.unit.builds, 'image')
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ matrix.unit.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ matrix.unit.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ matrix.unit.version }}
            type=semver,pattern={{major}},value=${{ matrix.unit.version }},enable=${{ matrix.unit.major != '0' }}
            type=raw,value=sha-${{ steps.source.outputs.short_sha }}
      - name: Publish verified container image
        id: push
        if: contains(matrix.unit.builds, 'image')
        env:
          IMAGE: ${{ matrix.unit.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          docker load --input "$ARTIFACTS/image.tar"
          while IFS= read -r target; do
            [ -n "$target" ] || continue
            docker tag agentflow-release:build "$target"
            docker push "$target"
          done <<<"$TAGS"
          digest=$(docker image inspect --format '{{json .RepoDigests}}' "$IMAGE:$VERSION" \
            | jq -er --arg image "$IMAGE" '.[] | select(startswith($image + "@")) | split("@")[1]')
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - if: contains(matrix.unit.builds, 'image')
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ matrix.unit.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - if: contains(matrix.unit.builds, 'helm')
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      - if: contains(matrix.unit.builds, 'helm')
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: ${{ env.ARTIFACTS }}/charts/*.tgz
      - name: Publish verified chart
        if: contains(matrix.unit.builds, 'helm')
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY: ${{ matrix.unit.registry }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s\n' "$GH_TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          for chart in "$ARTIFACTS"/charts/*.tgz; do helm push "$chart" "oci://$REGISTRY/charts"; done
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "$ARTIFACTS"/charts/*.tgz --clobber

      - name: Go module tag
        if: contains(matrix.unit.builds, 'library') && matrix.unit.publish == 'go' && matrix.unit.path != '.'
        env:
          GH_TOKEN: ${{ github.token }}
          AGENTFLOW_RELEASE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$UNIT_PATH/v$VERSION" -f sha="$AGENTFLOW_RELEASE_SHA"
      - if: contains(matrix.unit.builds, 'library') && matrix.unit.publish == 'npm'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          registry-url: https://npm.pkg.github.com
      - name: Publish verified npm package
        if: contains(matrix.unit.builds, 'library') && matrix.unit.publish == 'npm'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || github.token }}
        run: |
          npm publish "$ARTIFACTS"/libraries/*.tgz --provenance --access restricted --ignore-scripts
      - if: contains(matrix.unit.builds, 'library') && matrix.unit.publish == 'pypi' && vars.PYPI_PUBLISH == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: agentflow-release-artifacts/libraries

      - name: List artifacts on the release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILDS: ${{ matrix.unit.builds }}
          IMAGE: ${{ matrix.unit.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
          REGISTRY: ${{ matrix.unit.registry }}
          PUBLISH: ${{ matrix.unit.publish }}
        run: |
          set -euo pipefail
          {
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body
            echo
            echo "### Artifacts"
            [[ ",$BUILDS," == *,binary,* ]] && echo "- Binaries and \`checksums.txt\` attached below, with build provenance attestations"
            [[ ",$BUILDS," == *,image,* ]] && echo "- Image: \`$IMAGE:$VERSION\` (\`$DIGEST\`)"
            [[ ",$BUILDS," == *,helm,* ]] && echo "- Chart: \`oci://$REGISTRY/charts\` version \`$VERSION\`"
            [[ ",$BUILDS," == *,library,* ]] && echo "- Library: ${PUBLISH:-tag} \`$VERSION\`"
            echo
            echo "Production deploys must reference this release (agentflow release guard)."
          } > notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md

  jira:
    needs: [release, publish]
    if: always() && needs.release.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: $/actions/setup
        with:
          binary: true
      - id: task
        name: Resolve release task provider
        run: echo "provider=$(agentflow keys --provider)" >> "$GITHUB_OUTPUT"
      - name: Record released task references
        env:
          MATRIX: ${{ needs.release.outputs.matrix }}
          PROVIDER: ${{ steps.task.outputs.provider }}
          JIRA_BASE: ${{ vars.JIRA_BASE }}
          JIRA_USER: ${{ steps.task.outputs.provider == 'jira' && secrets.JIRA_USER || '' }}
          JIRA_TOKEN: ${{ steps.task.outputs.provider == 'jira' && secrets.JIRA_TOKEN || '' }}
        run: |
          set -euo pipefail
          if [ "$PROVIDER" = jira ] && [ -z "$JIRA_TOKEN" ]; then
            echo "::notice::No Jira credentials; skipping fix versions"
            exit 0
          fi
          jq -c '.[]' <<<"$MATRIX" | while read -r unit; do
            name=$(jq -r .name <<<"$unit"); tag=$(jq -r .tag <<<"$unit")
            version=$(jq -r .version <<<"$unit"); path=$(jq -r .path <<<"$unit")
            prefix=${tag%"$version"}
            prev=$(git describe --tags --abbrev=0 --match "${prefix}[0-9]*.[0-9]*.[0-9]*" "$tag^" 2>/dev/null || true)
            range=${prev:+$prev..}$tag
            if [ "$PROVIDER" = jira ]; then
              pathspec=()
              [ "$path" != "." ] && pathspec=(-- "$path")
              keys=$(git log --format='%B' "$range" ${pathspec[@]+"${pathspec[@]}"} | grep -Eo '[A-Z][A-Z0-9]+-[0-9]+' | sort -u || true)
              for key in $keys; do
                jira-fix-version.sh "$key" "$name $version" || echo "::warning::$key: could not set fix version"
              done
            else
              agentflow keys --shipped --range "$range" --path "$path" | while IFS= read -r key; do
                echo "Released task $key in $tag"
              done
            fi
          done
