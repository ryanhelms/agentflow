# Historical workflow name used by SHA-pinned consumers.
name: jira-key

on:
  workflow_call:
    inputs:
      warn-only:
        description: Report problems as warnings instead of failing
        type: boolean
        default: false
    secrets:
      JIRA_USER:
        required: false
      JIRA_TOKEN:
        required: false
      ASANA_ACCESS_TOKEN:
        required: false
      TASK_READ_TOKEN:
        description: Optional repository-scoped token with Issues read access
        required: false

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    if: vars.DEVFLOW_ENABLED != 'false'
    runs-on: ubuntu-latest
    steps:
      # Fetch the merge ref so both parents (including a fork's head) are available.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select trusted base configuration
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: git -c core.hooksPath=/dev/null checkout --detach "$BASE"
      - uses: $/actions/setup
        with:
          binary: true
      - id: task
        continue-on-error: ${{ inputs.warn-only }}
        name: Resolve task provider
        run: |
          provider=$(devflow keys --provider)
          echo "provider=$provider" >> "$GITHUB_OUTPUT"
      - name: Validate PR title, commits and task references
        env:
          DEVFLOW_HOME: ${{ runner.temp }}/devflow-key-check
          WARN_ONLY: ${{ inputs.warn-only }}
          JIRA_BASE: ${{ vars.JIRA_BASE }}
          JIRA_USER: ${{ steps.task.outputs.provider == 'jira' && secrets.JIRA_USER || '' }}
          JIRA_TOKEN: ${{ steps.task.outputs.provider == 'jira' && secrets.JIRA_TOKEN || '' }}
          PROVIDER: ${{ steps.task.outputs.provider }}
          ASANA_ACCESS_TOKEN: ${{ steps.task.outputs.provider == 'asana' && secrets.ASANA_ACCESS_TOKEN || '' }}
          GH_TOKEN: ${{ steps.task.outputs.provider == 'github-issues' && (secrets.TASK_READ_TOKEN || github.token) || steps.task.outputs.provider == 'repository' && github.token || '' }}
        run: |
          if [ "$PROVIDER" = repository ]; then gh auth setup-git --hostname github.com; fi
          if ! devflow lint-msg --github-event; then
            if [ "$WARN_ONLY" = true ]; then
              echo "::warning::Task validation failed. See the commit or reference diagnostic above."
            else
              exit 1
            fi
          fi
