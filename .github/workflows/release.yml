# agentflow's own releases: single branch, versioned straight from commit types.
#
# Every push to main computes the next version from the Conventional Commits since the
# last vX.Y.Z tag (fix/perf -> patch, feat -> minor, ! or BREAKING CHANGE -> major; before
# 1.0.0 a breaking change bumps the minor). If there is a bump, the workflow generates the
# CHANGELOG.md section (scripts/changelog.sh), commits it to main as
# "chore(release): vX.Y.Z", tags that commit, and GoReleaser publishes the GitHub Release
# with the same notes, binaries and checksums. No Release PR, no GitHub App. The commit is
# pushed with GITHUB_TOKEN, so it doesn't trigger another run; if main gets branch
# protection, allow github-actions to push or this step fails.
#
# v* tags are protected by the "Protect release tags" ruleset: only repo admins and the
# release deploy key (secret RELEASE_DEPLOY_KEY) may create, move or delete them, and
# GitHub Actions can't be a ruleset bypass actor. So every tag push below goes to the
# `release` remote over SSH with that key.
#
# Releases are published as normal, stable releases. The floating major tag (v0 while
# agentflow is 0.x, v1 from 1.0.0) then moves to the release so consuming repos that use
# ryanhelms/agentflow/...@v0 get it. A bad release is stopped with policy/versions.json
# (blocked/min_version) and agentflow update --rollback.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # The rename can merge ahead of cutover without publishing under the old signer.
    if: github.repository == 'ryanhelms/agentflow'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - id: version
        name: Next version from commit types
        run: |
          set -euo pipefail
          out=$(bin/next-version.sh --path . --prefix v --branch main --default-branch main --env)
          echo "$out"
          echo "$out" >> "$GITHUB_OUTPUT"
          next=$(sed -n 's/^next=//p' <<<"$out"); current=$(sed -n 's/^current=//p' <<<"$out")
          bump=$(sed -n 's/^bump=//p' <<<"$out"); last_tag=$(sed -n 's/^last_tag=//p' <<<"$out")
          if [ "$next" != "$current" ] || { [ -z "$last_tag" ] && [ "$next" != 0.0.0 ]; }; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Releasing v$next ($bump bump from ${last_tag:-no previous tag})"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No feat, fix or breaking commits since $last_tag; nothing to release"
          fi

      - if: steps.version.outputs.release == 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - if: steps.version.outputs.release == 'true'
        run: go test -race -count=1 ./...

      - name: Push release tags through origin
        # No deploy key or tag ruleset on this repository (GitHub Free). The
        # checkout's GITHUB_TOKEN credentials apply to the same URL.
        if: steps.version.outputs.release == 'true'
        run: git remote add release "$(git remote get-url origin)"

      - name: Commit the changelog and tag the release
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.next }}
          LAST_TAG: ${{ steps.version.outputs.last_tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          scripts/changelog.sh --version "$VERSION" --from "$LAST_TAG" --to HEAD \
            --repo "$GITHUB_REPOSITORY" --notes "$RUNNER_TEMP/release-notes.md" --update CHANGELOG.md
          # Keep the README status area on the current release.
          sed -i -E "s#(<!-- agentflow:version -->)[^<]*(<!-- /agentflow:version -->)#\1\`v$VERSION\`\2#" README.md
          # Publish matching host package versions in the same commit as the binary tag.
          plugin_manifests=(
            adapters/claude-code/.claude-plugin/plugin.json
            .codex-plugin/plugin.json
            .cursor-plugin/plugin.json
            plugin.json
            gemini-extension.json
          )
          for manifest in "${plugin_manifests[@]}"; do
            jq --arg version "$VERSION" '.version = $version' "$manifest" > "$RUNNER_TEMP/plugin-manifest.json"
            cp "$RUNNER_TEMP/plugin-manifest.json" "$manifest"
          done
          git add CHANGELOG.md README.md "${plugin_manifests[@]}"
          git commit -m "chore(release): v$VERSION"
          git tag -a "v$VERSION" -m "agentflow v$VERSION"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push release "refs/tags/v$VERSION"

      - name: Build and upload the draft GitHub Release
        if: steps.version.outputs.release == 'true'
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - if: steps.version.outputs.release == 'true'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            install.sh
            install.ps1

      - name: Verify and publish the GitHub Release
        id: publish
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          artifacts=$(mktemp -d)
          trap 'rm -rf "$artifacts"' EXIT
          gh release download "$TAG" --dir "$artifacts"
          cd "$artifacts"
          sha256sum --check checksums.txt
          for file in *.tar.gz *.zip install.sh install.ps1; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          done
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

      - name: Move the floating major tag
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.next }}
        run: |
          major="v${VERSION%%.*}"
          git tag -f "$major" "v$VERSION^{}"
          git push -f release "refs/tags/$major"
          echo "::notice::$major now points at v$VERSION"

      - name: Clean up a failed draft release
        if: failure() && steps.version.outputs.release == 'true' && steps.publish.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true ]; then
            gh release delete "$TAG" --yes
            git push --delete release "refs/tags/$TAG"
          fi
