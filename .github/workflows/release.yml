# devflow's own releases: single branch, versioned straight from commit types.
#
# Every push to main computes the next version from the Conventional Commits since the
# last v* tag (fix/perf -> patch, feat -> minor, ! or BREAKING CHANGE -> major; before
# 1.0.0 a breaking change bumps the minor). If there is a bump, the merge commit itself
# is tagged and GoReleaser publishes the GitHub Release with binaries, checksums and a
# changelog grouped by type. No Release PR, no version-bump commit, no GitHub App.
#
# Releases start as pre-releases (the beta channel) and promote.yml marks them stable
# after 24h unless an issue labelled release-blocker is open.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: version
        name: Next version from commit types
        run: |
          set -euo pipefail
          out=$(bin/next-version.sh --path . --prefix v --branch main --default-branch main --env)
          echo "$out"
          echo "$out" >> "$GITHUB_OUTPUT"
          next=$(sed -n 's/^next=//p' <<<"$out"); current=$(sed -n 's/^current=//p' <<<"$out")
          bump=$(sed -n 's/^bump=//p' <<<"$out"); last_tag=$(sed -n 's/^last_tag=//p' <<<"$out")
          if [ "$next" != "$current" ] || { [ -z "$last_tag" ] && [ "$next" != 0.0.0 ]; }; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Releasing v$next ($bump bump from ${last_tag:-no previous tag})"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No feat, fix or breaking commits since $last_tag; nothing to release"
          fi

      - if: steps.version.outputs.release == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - if: steps.version.outputs.release == 'true'
        run: go test -race -count=1 ./...

      - name: Tag the merge commit
        if: steps.version.outputs.release == 'true'
        env:
          TAG: v${{ steps.version.outputs.next }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "devflow $TAG"
          git push origin "$TAG"

      - name: Build and publish the GitHub Release
        if: steps.version.outputs.release == 'true'
        uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - if: steps.version.outputs.release == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      - name: Remove the tag if the release failed
        if: failure() && steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.next }}
        run: |
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null \
            || git push --delete origin "$TAG" || true
