name: agentflow provider pilot

on:
  pull_request:
    types: [opened, reopened, ready_for_review, closed]
    branches: [main]

permissions: {}

jobs:
  preview:
    if: >-
      vars.AGENTFLOW_ENABLED != 'false' &&
      github.repository == 'nscaledev/agentflow' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      issues: read
    uses: ./.github/workflows/task-events.yml

  approved-issue:
    needs: preview
    if: >-
      vars.AGENTFLOW_ENABLED != 'false' &&
      github.repository == 'nscaledev/agentflow' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.AGENTFLOW_PROVIDER_PILOT_ISSUE != '' &&
      needs.preview.outputs.merged-issue == vars.AGENTFLOW_PROVIDER_PILOT_ISSUE
    permissions:
      contents: read
      issues: write
    concurrency:
      group: agentflow-provider-pilot-${{ github.repository_id }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the default-branch merge commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Build agentflow
        run: go build -o "$RUNNER_TEMP/agentflow" ./cmd/agentflow
      - name: Verify the published pilot ADR
        env:
          GH_TOKEN: ${{ github.token }}
          AGENTFLOW_NO_UPDATE: "1"
          AGENTFLOW_HOME: ${{ runner.temp }}/agentflow-provider-pilot
        run: |
          gh auth setup-git --hostname github.com
          "$RUNNER_TEMP/agentflow" docs search provider-architecture --space engineering --json \
            | jq -e 'any(.pages[]; .ref == {instance: "repository", scope: "engineering", id: "provider-architecture"})'
      - name: Close the approved issue
        env:
          GH_TOKEN: ${{ github.token }}
          AGENTFLOW_HOME: ${{ runner.temp }}/agentflow-provider-pilot
          AGENTFLOW_NO_UPDATE: "1"
          AGENTFLOW_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          AGENTFLOW_APPROVED_ISSUE: ${{ vars.AGENTFLOW_PROVIDER_PILOT_ISSUE }}
        run: |
          if [[ ! "$AGENTFLOW_APPROVED_ISSUE" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Set AGENTFLOW_PROVIDER_PILOT_ISSUE to the exact pilot issue number"
            exit 1
          fi
          umask 077
          mkdir -p "$AGENTFLOW_HOME"
          printf '%s\n' 'autonomy: {remote: auto}' > "$AGENTFLOW_HOME/config.yml"
          "$RUNNER_TEMP/agentflow" transition --github-event
