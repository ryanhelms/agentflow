# Reusable: render Jira-linked notes for a GitHub release, append them to the release
# and publish them to Confluence under the project's release notes page. The caller runs
# it after semver-release with each released tag (no GitHub App needed), or on a
# `release` event for releases made by hand.
name: release-notes

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag (default the tag of the triggering release event)
        type: string
        default: ""
      confluence-space:
        description: Confluence space key (empty = skip Confluence)
        type: string
        default: ""
      confluence-parent-id:
        description: Page id of the "Release Notes" parent page
        type: string
        default: "-"
    secrets:
      JIRA_USER:
        required: false
      JIRA_TOKEN:
        required: false

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: nscaledev/agentflow/actions/setup@v0
        with:
          binary: true
      - id: task
        run: |
          provider=$(agentflow keys --provider)
          echo "provider=$provider" >> "$GITHUB_OUTPUT"
      - id: knowledge
        name: Resolve knowledge provider
        run: |
          provider=$(agentflow setup providers --json | jq -r '.roles[] | select(.role == "knowledge_base") | .selected // "none"')
          echo "provider=$provider" >> "$GITHUB_OUTPUT"
      - name: Render notes
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
          PROVIDER: ${{ steps.task.outputs.provider }}
          JIRA_BASE: ${{ vars.JIRA_BASE }}
          JIRA_USER: ${{ steps.task.outputs.provider == 'jira' && secrets.JIRA_USER || '' }}
          JIRA_TOKEN: ${{ steps.task.outputs.provider == 'jira' && secrets.JIRA_TOKEN || '' }}
        run: |
          set -euo pipefail
          prev=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          range="${prev:+$prev..}$TAG"
          release-notes.sh "$range" "${GITHUB_REPOSITORY#*/} $TAG" "$PROVIDER" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Append to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json body -q .body > "$RUNNER_TEMP/body.md"
          if ! grep -q '<!-- agentflow:notes -->' "$RUNNER_TEMP/body.md"; then
            { printf '\n\n<!-- agentflow:notes -->\n'; tail -n +2 "$RUNNER_TEMP/notes.md"; } >> "$RUNNER_TEMP/body.md"
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/body.md"
          fi
      - name: Publish to Confluence
        if: steps.knowledge.outputs.provider == 'confluence' && inputs.confluence-space != '' && vars.CONFLUENCE_BASE != ''
        env:
          CONFLUENCE_BASE: ${{ vars.CONFLUENCE_BASE }}
          JIRA_USER: ${{ secrets.JIRA_USER }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          SPACE: ${{ inputs.confluence-space }}
          PARENT: ${{ inputs.confluence-parent-id }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          sudo apt-get install -y -qq pandoc >/dev/null
          confluence-upsert.sh "$SPACE" "$PARENT" "${GITHUB_REPOSITORY#*/} $TAG" "$RUNNER_TEMP/notes.md"
