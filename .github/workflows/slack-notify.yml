# Reusable delivery signal. With default settings it posts the legacy Slack message.
name: slack-notify

on:
  workflow_call:
    inputs:
      message:
        description: Message text (Slack mrkdwn). The run link is appended.
        type: string
        required: true
      signal:
        description: Notification route in the repository configuration
        type: string
        default: delivery
      signal-id:
        description: Stable slot for this call within the run. Use distinct IDs for repeated calls with the same signal.
        type: string
        default: default
      append-run-link:
        description: Append the run link in legacy Slack format
        type: boolean
        default: true
    secrets:
      SLACK_WEBHOOK_URL:
        required: false
      WEBHOOK_URL:
        required: false

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      SIGNAL: ${{ inputs.signal }}
      SIGNAL_ID: ${{ inputs.signal-id }}
    steps:
      - name: Read trusted repository configuration
        uses: actions/checkout@v4
        with:
          ref: refs/heads/${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: nscaledev/devflow/actions/setup@v0
        with:
          binary: true
      - name: Identify this notification slot
        id: slot
        run: |
          if [[ ! "$SIGNAL" =~ ^[a-zA-Z0-9][a-zA-Z0-9_.-]*$ || ! "$SIGNAL_ID" =~ ^[a-zA-Z0-9][a-zA-Z0-9_.-]*$ ]]; then
            echo "::error::Invalid notification signal or signal-id"
            exit 1
          fi
          slot=$(printf '%s\n' "$SIGNAL" "$SIGNAL_ID" | sha256sum | cut -d ' ' -f 1)
          home=$(mktemp -d "$RUNNER_TEMP/devflow-notify.XXXXXX")
          echo "DEVFLOW_HOME=$home" >> "$GITHUB_ENV"
          echo "name=devflow-notify-$slot" >> "$GITHUB_OUTPUT"
          echo "previous=$((GITHUB_RUN_ATTEMPT - 1))" >> "$GITHUB_OUTPUT"
      - name: Restore receipts from the preceding run attempt
        if: github.run_attempt != 1
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.slot.outputs.name }}-receipts-${{ steps.slot.outputs.previous }}
          path: ${{ env.DEVFLOW_HOME }}
      - name: Prepare durable replay metadata
        run: |
          umask 077
          if [[ "$GITHUB_RUN_ATTEMPT" != 1 ]]; then
            if ! (cd "$DEVFLOW_HOME" &&
                  [[ $(cat snapshot-ready) == "$((GITHUB_RUN_ATTEMPT - 1))" ]] &&
                  sha256sum --check --strict checksums); then
              echo "::error::Prior notification state is unavailable or incomplete. Reconcile the prior delivery before sending again."
              exit 1
            fi
          fi
          printf '%s\n' "$GITHUB_RUN_ATTEMPT" > "$DEVFLOW_HOME/reservation"
          printf '%s\n' "$GITHUB_RUN_ATTEMPT" > "$DEVFLOW_HOME/snapshot-ready"
      - name: Reserve this notification slot before delivery
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.slot.outputs.name }}-reservation-${{ github.run_attempt }}
          path: ${{ env.DEVFLOW_HOME }}/reservation
          if-no-files-found: error
      - name: Deliver notification
        id: deliver
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          MESSAGE: ${{ inputs.message }}
          APPEND_RUN_LINK: ${{ inputs.append-run-link }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ "$APPEND_RUN_LINK" == true ]]; then
            MESSAGE+=" <$RUN_URL|run>"
          fi
          devflow notify "$SIGNAL" --operation-id "$GITHUB_REPOSITORY_ID/$GITHUB_RUN_ID/$SIGNAL_ID" \
            --body "$MESSAGE" --yes | tee "$DEVFLOW_HOME/delivery.json"
      - name: Verify and index receipt snapshot contents
        if: always() && (steps.deliver.outcome == 'success' || steps.deliver.outcome == 'failure')
        id: snapshot
        run: |
          cd "$DEVFLOW_HOME"
          shopt -s nullglob
          sha256sum snapshot-ready delivery.json notification-receipts/*.claim notification-receipts/*.outcome > checksums
      - name: Save notification receipts and outcomes for replay
        if: always() && steps.snapshot.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.slot.outputs.name }}-receipts-${{ github.run_attempt }}
          path: |
            ${{ env.DEVFLOW_HOME }}/snapshot-ready
            ${{ env.DEVFLOW_HOME }}/delivery.json
            ${{ env.DEVFLOW_HOME }}/checksums
            ${{ env.DEVFLOW_HOME }}/notification-receipts/*.claim
            ${{ env.DEVFLOW_HOME }}/notification-receipts/*.outcome
          if-no-files-found: error
