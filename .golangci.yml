version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nolintlint
    - revive
    - unconvert
    - unparam
  settings:
    gosec:
      excludes:
        - G204 # agentflow shells out to git and gh by design
        - G301 # repo dirs it creates (docs/adr, .agentflow, client config dirs) are meant to be readable
        - G304 # paths come from git rev-parse, config and the user's own repo
        - G306 # files written into the repo are committed and must be world-readable
        - G703 # same as G304: paths are derived from the repo root or cache dir
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec, unparam]

formatters:
  enable:
    - gofmt
    - goimports
