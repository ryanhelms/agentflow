# devflow caller workflow (generated by `devflow init`; commit it).
# Behaviour lives in nscaledev/devflow. `devflow init` pins every reference below to the
# commit of a release (@<sha> # vX.Y.Z); Dependabot (.github/dependabot.yml) opens a PR
# for each new devflow release, so updates are reviewed before they run here.
# Kill switch: set the repo variable DEVFLOW_ENABLED=false.
# Each job gets only the secrets it uses (never `secrets: inherit`) and only the
# permissions it needs.
name: devflow

on:
  create:
  pull_request:
    types: [opened, edited, reopened, synchronize, closed, ready_for_review]
  push:
  release:
    types: [published]
  issues:
    types: [labeled]
  schedule:
    - cron: "0 8 * * 1-5"   # weekdays: hygiene + security alerts
    - cron: "0 7 * * 1"     # Mondays: sprint report
  workflow_dispatch:
  # To raise Jira bugs for failing default-branch CI, list your CI workflow names:
  # workflow_run:
  #   workflows: [ci]
  #   types: [completed]

permissions:
  contents: read

jobs:
  key-check:
    if: >-
      github.event_name == 'pull_request' && github.event.action != 'closed' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    uses: nscaledev/devflow/.github/workflows/jira-key.yml@v0
    permissions:
      contents: read
      pull-requests: read
    with:
      warn-only: false        # true reports problems as warnings (first weeks of rollout phase P2)
    secrets:
      JIRA_USER: ${{ secrets.JIRA_USER }}
      JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}

  transitions:
    if: >-
      vars.DEVFLOW_ENABLED != 'false' &&
      (github.event_name == 'create' || github.event_name == 'pull_request' || github.event_name == 'push')
    uses: nscaledev/devflow/.github/workflows/transitions.yml@v0
    permissions:
      contents: read
    secrets:
      JIRA_USER: ${{ secrets.JIRA_USER }}
      JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}

  # Semantic versioning: every merge to the default branch with feat/fix/! commits
  # publishes a GitHub Release per changed unit in .devflow/releases.yml, with its
  # binaries, image, chart or package, and sets Jira fix versions.
  release:
    if: >-
      vars.DEVFLOW_ENABLED != 'false' && github.event_name == 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: nscaledev/devflow/.github/workflows/semver-release.yml@v0
    permissions:
      contents: write
      pull-requests: write
      packages: write
      id-token: write
      attestations: write
    secrets:
      DEVFLOW_APP_PRIVATE_KEY: ${{ secrets.DEVFLOW_APP_PRIVATE_KEY }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      JIRA_USER: ${{ secrets.JIRA_USER }}
      JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}

  release-notes:
    if: github.event_name == 'release'
    uses: nscaledev/devflow/.github/workflows/release-notes.yml@v0
    permissions:
      contents: write
    with:
      confluence-space: PLAT
      confluence-parent-id: "-"   # page id of "Release Notes" in the space
    secrets:
      JIRA_USER: ${{ secrets.JIRA_USER }}
      JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}

  docs-sync:
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: nscaledev/devflow/.github/workflows/docs-sync.yml@v0
    permissions:
      contents: read
    secrets:
      JIRA_USER: ${{ secrets.JIRA_USER }}
      JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}

  ai-pr-draft:
    if: github.event_name == 'pull_request' && github.event.action == 'opened'
    uses: nscaledev/devflow/.github/workflows/ai-pr-draft.yml@v0
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      JIRA_USER: ${{ secrets.JIRA_USER }}
      JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}

  auto-issues:
    if: >-
      github.event_name == 'issues' || github.event_name == 'workflow_run' ||
      (github.event_name == 'schedule' && github.event.schedule == '0 8 * * 1-5')
    uses: nscaledev/devflow/.github/workflows/auto-issues.yml@v0
    permissions:
      contents: read
      issues: write
      actions: read
      security-events: read
    with:
      project: PLAT
    secrets:
      JIRA_USER: ${{ secrets.JIRA_USER }}
      JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
      DEVFLOW_APP_PRIVATE_KEY: ${{ secrets.DEVFLOW_APP_PRIVATE_KEY }}

  hygiene:
    if: github.event_name == 'schedule' && github.event.schedule == '0 8 * * 1-5'
    uses: nscaledev/devflow/.github/workflows/hygiene.yml@v0
    permissions:
      contents: read
      pull-requests: read
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  sprint-report:
    if: github.event_name == 'schedule' && github.event.schedule == '0 7 * * 1'
    uses: nscaledev/devflow/.github/workflows/sprint-report.yml@v0
    permissions:
      contents: read
      pull-requests: read
    with:
      project: PLAT
      confluence-space: PLAT
      days: 14
    secrets:
      JIRA_USER: ${{ secrets.JIRA_USER }}
      JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
