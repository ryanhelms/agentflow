# agentflow caller workflow (generated by `agentflow init`; commit it).
# Behaviour lives in nscaledev/agentflow. `agentflow init` pins every reference below to the
# commit of a release (@<sha> # vX.Y.Z). `agentflow pin` (or /agentflow:pin in Claude Code,
# which suggests it when the pin is behind) moves them to a newer release in a PR, so
# updates are reviewed before they run here.
# Kill switch: set the repo variable AGENTFLOW_ENABLED=false to skip every job.
# Each job gets only the secrets it uses (never `secrets: inherit`) and only the
# permissions it needs.
name: agentflow

on:
  create:
  pull_request:
    types: [opened, edited, reopened, synchronize, closed, ready_for_review]
  push:
  issues:
    types: [labeled]
  schedule:
    - cron: "0 8 * * 1-5"   # weekdays: hygiene + security alerts
    - cron: "0 7 * * 1"     # Mondays: sprint report
  workflow_dispatch:
  # To raise Jira bugs for failing default-branch CI, list your CI workflow names:
  # workflow_run:
  #   workflows: [ci]
  #   types: [completed]

permissions:
  contents: read

jobs:
  key-check:
    if: >-
      vars.AGENTFLOW_ENABLED != 'false' &&
      github.event_name == 'pull_request' && github.event.action != 'closed' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    uses: nscaledev/agentflow/.github/workflows/jira-key.yml@v0
    permissions:
      contents: read
      pull-requests: read
    with:
      warn-only: false        # true reports problems as warnings (first weeks of rollout phase P2)
    secrets:
      JIRA_USER: ${{ secrets.JIRA_USER }}
      JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
      TASK_READ_TOKEN: ${{ secrets.TASK_READ_TOKEN }}  # optional, Issues read for private repositories
      ASANA_ACCESS_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN }}  # optional, read access for selected Asana projects

  transitions:
    if: >-
      vars.AGENTFLOW_ENABLED != 'false' &&
      (github.event_name == 'create' || github.event_name == 'pull_request' || github.event_name == 'push')
    uses: nscaledev/agentflow/.github/workflows/transitions.yml@v0
    permissions:
      contents: read
    secrets:
      JIRA_USER: ${{ secrets.JIRA_USER }}
      JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
      TASK_READ_TOKEN: ${{ secrets.TASK_READ_TOKEN }}  # optional, Issues read for private repositories
      ASANA_ACCESS_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN }}  # optional, read access for selected Asana projects

  # Semantic versioning: every merge to the default branch with feat/fix/! commits
  # publishes a GitHub Release per changed unit in .agentflow/releases.yml, with its
  # binaries, image, chart or package, and previews linked tasks and Jira fix versions.
  release:
    if: >-
      vars.AGENTFLOW_ENABLED != 'false' && github.event_name == 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: nscaledev/agentflow/.github/workflows/semver-release.yml@v0
    permissions:
      contents: write
      pull-requests: write
      packages: write
      id-token: write
      attestations: write
    secrets:
      AGENTFLOW_APP_PRIVATE_KEY: ${{ secrets.AGENTFLOW_APP_PRIVATE_KEY }}   # optional
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Notes for each unit the release job just published (Jira-linked, plus Confluence).
  release-notes:
    needs: release
    if: needs.release.outputs.releases != '' && needs.release.outputs.releases != '[]'
    strategy:
      matrix:
        unit: ${{ fromJSON(needs.release.outputs.releases) }}
    uses: nscaledev/agentflow/.github/workflows/release-notes.yml@v0
    permissions:
      contents: write
    with:
      tag: ${{ matrix.unit.tag }}
      confluence-space: PLAT
      confluence-parent-id: "-"   # page id of "Release Notes" in the space
    secrets:
      JIRA_USER: ${{ secrets.JIRA_USER }}
      JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}

  docs-sync:
    if: >-
      vars.AGENTFLOW_ENABLED != 'false' &&
      github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: nscaledev/agentflow/.github/workflows/docs-sync.yml@v0
    permissions:
      contents: read
    secrets:
      JIRA_USER: ${{ secrets.JIRA_USER }}
      JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}

  ai-pr-draft:
    if: >-
      vars.AGENTFLOW_ENABLED != 'false' &&
      github.event_name == 'pull_request' && github.event.action == 'opened'
    uses: nscaledev/agentflow/.github/workflows/ai-pr-draft.yml@v0
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      JIRA_USER: ${{ secrets.JIRA_USER }}
      JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}

  auto-issues:
    if: >-
      vars.AGENTFLOW_ENABLED != 'false' &&
      (github.event_name == 'issues' || github.event_name == 'workflow_run' ||
      (github.event_name == 'schedule' && github.event.schedule == '0 8 * * 1-5'))
    uses: nscaledev/agentflow/.github/workflows/auto-issues.yml@v0
    permissions:
      contents: read
      issues: write
      actions: read
      security-events: read
    with:
      project: PLAT
    secrets:
      JIRA_USER: ${{ secrets.JIRA_USER }}
      JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
      AGENTFLOW_APP_PRIVATE_KEY: ${{ secrets.AGENTFLOW_APP_PRIVATE_KEY }}   # optional: Dependabot alerts

  hygiene:
    if: >-
      vars.AGENTFLOW_ENABLED != 'false' &&
      github.event_name == 'schedule' && github.event.schedule == '0 8 * * 1-5'
    uses: nscaledev/agentflow/.github/workflows/hygiene.yml@v0
    permissions:
      contents: read
      pull-requests: read
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  sprint-report:
    if: >-
      vars.AGENTFLOW_ENABLED != 'false' &&
      github.event_name == 'schedule' && github.event.schedule == '0 7 * * 1'
    uses: nscaledev/agentflow/.github/workflows/sprint-report.yml@v0
    permissions:
      contents: read
      pull-requests: read
    with:
      project: PLAT
      confluence-space: PLAT
      days: 14
    secrets:
      JIRA_USER: ${{ secrets.JIRA_USER }}
      JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
