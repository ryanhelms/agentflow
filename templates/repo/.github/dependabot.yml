# Generated by `devflow init`; commit it. Keeps the pinned nscaledev/devflow references in
# .github/workflows/devflow.yml current: one PR per devflow release, for review.
# Dependabot needs access to internal repos (org setting: Code security >
# Grant Dependabot access to private repositories > nscaledev/devflow).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    allow:
      - dependency-name: "nscaledev/devflow*"
    groups:
      devflow:
        patterns: ["nscaledev/devflow*"]
    commit-message:
      prefix: chore
      include: scope
