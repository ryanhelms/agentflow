# This repository uses agentflow for its own provider pilot.
agentflow: 1

task_management:
  provider: github-issues
  settings:
    repository: ryanhelms/agentflow
    transitions:
      pr.merged: closed
      "#done": none
  templates:
    catalog: .agentflow/task-templates.json
    default:
      name: engineering-task
      revision: "1"

knowledge_base:
  provider: repository
  settings:
    directory: docs/knowledge
    publication: pull-request

commit:
  types: [feat, fix, perf, refactor, docs, test, build, ci, chore, revert]
  subject_max: 72
  ai_trailer: false
  require_key: false
